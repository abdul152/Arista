name: evpn

topology:
  kinds:
    ceos:
      image: ceos:4.35.5M64
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    spine1:  {kind: ceos, startup-config: configs/spine1.cfg}
    spine2:  {kind: ceos, startup-config: configs/spine2.cfg}
    leaf1:   {kind: ceos, startup-config: configs/leaf1.cfg}
    leaf2:   {kind: ceos, startup-config: configs/leaf2.cfg}
    leaf3:   {kind: ceos, startup-config: configs/leaf3.cfg}
    leaf4:   {kind: ceos, startup-config: configs/leaf4.cfg}
    access1: {kind: ceos, startup-config: configs/access1.cfg}
    access2: {kind: ceos, startup-config: configs/access2.cfg}
    host1:
      kind: linux
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
    host2:
      kind: linux
      exec:
        - ip addr add 10.20.20.2/24 dev eth1
    host3:
      kind: linux
      exec:
        - ip addr add 10.10.10.3/24 dev eth1
    host4:
      kind: linux
      exec:
        - ip addr add 10.20.20.4/24 dev eth1

  links:
    # spine1 <-> leafs
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    # spine2 <-> leafs
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
    # MLAG peer-links
    - endpoints: ["leaf1:eth4", "leaf2:eth4"]
    - endpoints: ["leaf3:eth4", "leaf4:eth4"]
    # leafs <-> access (MLAG dual-homed)
    - endpoints: ["leaf1:eth3", "access1:eth1"]
    - endpoints: ["leaf2:eth3", "access1:eth2"]
    - endpoints: ["leaf3:eth3", "access2:eth1"]
    - endpoints: ["leaf4:eth3", "access2:eth2"]
    # access <-> hosts
    - endpoints: ["access1:eth3", "host1:eth1"]
    - endpoints: ["access1:eth4", "host2:eth1"]
    - endpoints: ["access2:eth3", "host3:eth1"]
    - endpoints: ["access2:eth4", "host4:eth1"]
