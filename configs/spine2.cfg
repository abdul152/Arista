hostname spine2
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
no aaa root
ip routing
!
vlan 10
!
vlan 20
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   no switchport
   ip address 10.0.2.0/31
interface Ethernet2
   no switchport
   ip address 10.0.2.2/31
interface Ethernet3
   no switchport
   ip address 10.0.2.4/31
interface Ethernet4
   no switchport
   ip address 10.0.2.6/31
!
router bgp 65000
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor EVPN peer group
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN next-hop-unchanged
   neighbor EVPN send-community extended
   neighbor 10.0.2.1 peer group UNDERLAY
   neighbor 10.0.2.1 remote-as 65101
   neighbor 10.0.2.3 peer group UNDERLAY
   neighbor 10.0.2.3 remote-as 65101
   neighbor 10.0.2.5 peer group UNDERLAY
   neighbor 10.0.2.5 remote-as 65102
   neighbor 10.0.2.7 peer group UNDERLAY
   neighbor 10.0.2.7 remote-as 65102
   neighbor 10.255.1.1 peer group EVPN
   neighbor 10.255.1.1 remote-as 65101
   neighbor 10.255.1.2 peer group EVPN
   neighbor 10.255.1.2 remote-as 65101
   neighbor 10.255.1.3 peer group EVPN
   neighbor 10.255.1.3 remote-as 65102
   neighbor 10.255.1.4 peer group EVPN
   neighbor 10.255.1.4 remote-as 65102
   !
   address-family evpn
      neighbor EVPN activate
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.255.0.2/32
!
!
vrf instance TENANT-A
vrf instance TENANT-B
!
ip virtual-router mac-address 00:1c:73:00:00:99
ip routing vrf TENANT-A
ip routing vrf TENANT-B
!
interface Vlan10
   vrf TENANT-A
   ip address virtual 10.10.10.254/24
interface Vlan20
   vrf TENANT-B
   ip address virtual 10.20.20.254/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT-A vni 50001
   vxlan vrf TENANT-B vni 50002
!
router bgp 65000
   vlan 10
      rd 10.255.0.2:10010
      route-target both 10010:10010
      redistribute learned
   vlan 20
      rd 10.255.0.2:10020
      route-target both 10020:10020
      redistribute learned
   vrf TENANT-A
      rd 10.255.0.2:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      redistribute connected
   vrf TENANT-B
      rd 10.255.0.2:50002
      route-target import evpn 50002:50002
      route-target export evpn 50002:50002
      redistribute connected
