hostname leaf4
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
no aaa root
spanning-tree mode mstp
ip routing
!
vlan 10
   name SERVERS-10
vlan 20
   name SERVERS-20
vlan 4094
   name MLAG-PEER
   trunk group MLAGPEER
!
no spanning-tree vlan-id 4094
!
interface Loopback0
   ip address 10.255.1.4/32
interface Loopback1
   description Shared VTEP pair2
   ip address 10.255.2.2/32
!
interface Ethernet1
   no switchport
   ip address 10.0.1.7/31
interface Ethernet2
   no switchport
   ip address 10.0.2.7/31
interface Ethernet3
   channel-group 10 mode active
interface Ethernet4
   channel-group 1000 mode active
!
interface Port-Channel10
   description to access2
   switchport mode trunk
   switchport trunk allowed vlan 10,20
   mlag 10
interface Port-Channel1000
   description MLAG peer-link
   switchport mode trunk
   switchport trunk group MLAGPEER
!
interface Vlan4094
   no autostate
   ip address 10.255.253.1/31
!
mlag configuration
   domain-id MLAG2
   local-interface Vlan4094
   peer-address 10.255.253.0
   peer-link Port-Channel1000
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
!
router bgp 65102
   router-id 10.255.1.4
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor SPINE-UNDERLAY peer group
   neighbor SPINE-UNDERLAY remote-as 65000
   neighbor SPINE-UNDERLAY send-community
   neighbor SPINE-EVPN peer group
   neighbor SPINE-EVPN remote-as 65000
   neighbor SPINE-EVPN update-source Loopback0
   neighbor SPINE-EVPN ebgp-multihop 3
   neighbor SPINE-EVPN send-community extended
   neighbor MLAG-PEER peer group
   neighbor MLAG-PEER remote-as 65102
   neighbor MLAG-PEER next-hop-self
   neighbor MLAG-PEER send-community
   neighbor 10.0.1.6 peer group SPINE-UNDERLAY
   neighbor 10.0.2.6 peer group SPINE-UNDERLAY
   neighbor 10.255.0.1 peer group SPINE-EVPN
   neighbor 10.255.0.2 peer group SPINE-EVPN
   neighbor 10.255.253.0 peer group MLAG-PEER
   !
   vlan 10
      rd 10.255.1.4:10010
      route-target both 10010:10010
      redistribute learned
   vlan 20
      rd 10.255.1.4:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor SPINE-EVPN activate
   address-family ipv4
      neighbor SPINE-UNDERLAY activate
      neighbor MLAG-PEER activate
      network 10.255.1.4/32
      network 10.255.2.2/32
