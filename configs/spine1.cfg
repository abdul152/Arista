hostname spine1
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
no aaa root
ip routing
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Ethernet1
   no switchport
   ip address 10.0.1.0/31
interface Ethernet2
   no switchport
   ip address 10.0.1.2/31
interface Ethernet3
   no switchport
   ip address 10.0.1.4/31
interface Ethernet4
   no switchport
   ip address 10.0.1.6/31
!
router bgp 65000
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor EVPN peer group
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN next-hop-unchanged
   neighbor EVPN send-community extended
   neighbor 10.0.1.1 peer group UNDERLAY
   neighbor 10.0.1.1 remote-as 65101
   neighbor 10.0.1.3 peer group UNDERLAY
   neighbor 10.0.1.3 remote-as 65101
   neighbor 10.0.1.5 peer group UNDERLAY
   neighbor 10.0.1.5 remote-as 65102
   neighbor 10.0.1.7 peer group UNDERLAY
   neighbor 10.0.1.7 remote-as 65102
   neighbor 10.255.1.1 peer group EVPN
   neighbor 10.255.1.1 remote-as 65101
   neighbor 10.255.1.2 peer group EVPN
   neighbor 10.255.1.2 remote-as 65101
   neighbor 10.255.1.3 peer group EVPN
   neighbor 10.255.1.3 remote-as 65102
   neighbor 10.255.1.4 peer group EVPN
   neighbor 10.255.1.4 remote-as 65102
   !
   address-family evpn
      neighbor EVPN activate
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.255.0.1/32
